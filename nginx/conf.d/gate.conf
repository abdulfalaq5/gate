# Production API - Port 9509 untuk Customer
upstream gate_production {
    server gate-api-production:9509;
}

# Development API - Port 9513 untuk Dev
upstream gate_development {
    server gate-api-development:9513;
}

# Production Server Block
server {
    listen 80;
    server_name production.local gate.local;

    location / {
        proxy_pass http://gate_production;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://gate_production/health;
        access_log off;
    }
}

# Development Server Block
server {
    listen 8080;
    server_name dev.local gate-dev.local;

    location / {
        proxy_pass http://gate_development;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://gate_development/health;
        access_log off;
    }
}

