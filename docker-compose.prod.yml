version: '3.8'

services:
  # Production API - Port 9509 untuk Customer
  api:
    container_name: gate-api-production
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "9509:9509"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./public:/app/public
      - ./storages:/app/storages
    environment:
      - NODE_ENV=production
      - APP_PORT=9509
      - APP_NAME=Gate-API-Production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9509/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    networks:
      - gate-network

networks:
  gate-network:
    driver: bridge

