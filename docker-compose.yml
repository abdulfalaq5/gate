version: '3.8'

services:
  app:
    container_name: gate-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./public:/app/public
      - ./storages:/app/storages
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - APP_PORT=${APP_PORT:-3000}
      # Override DB_NAME jika gate_sso tidak ada, gunakan gate_db
      - DB_NAME_DEV=${DB_NAME_DEV:-gate_db}
    # Untuk connect ke database di host machine (Mac/Windows/Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Alternative: uncomment jika host.docker.internal tidak bekerja (Linux)
    # network_mode: "host"
