services:
  api:
    container_name: core-api-msi-server
    image: core-api-msi-server
    build:
      context: .
      dockerfile: Dockerfile
    # Load semua environment variables dari file .env
    # Semua config (database, redis, rabbitmq, dll) harus ada di file .env
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./public:/app/public
      - ./storages:/app/storages
    # Hanya override variables yang berbeda untuk Docker environment
    # Semua variables lain (DB_HOST_PROD, DB_USER_PROD, REDIS_HOST, dll) 
    # akan diambil dari file .env via env_file di atas
    environment:
      # Override untuk production server
      - NODE_ENV=production
      - APP_PORT=9601
      # Override RabbitMQ URL jika berbeda dari .env (sesuaikan dengan server)
      - RABBITMQ_URL=amqp://api_user:api_password@103.169.73.226:9505
      # Override database host jika database di container/service lain (contoh)
      # - DB_HOST_PROD=postgres-service  # Uncomment jika DB di container lain
      # - POSTGRES_HOST=postgres-service  # Uncomment jika DB di container lain
      # Override Redis host jika Redis di container/service lain (contoh)
      # - REDIS_HOST=redis-service  # Uncomment jika Redis di container lain
      # APM Configuration (disable untuk production jika tidak digunakan)
      - APM_SERVICE_URL=
      - APM_SERVICE_NAME=
      - APM_SERVICE_TOKEN=
      - ELASTIC_APM_SERVER_URL=
      - ELASTIC_APM_SECRET_TOKEN=
      - ELASTIC_APM_SERVICE_NAME=
      - ELASTIC_APM_ENVIRONMENT=production
      - ELASTIC_APM_ACTIVE=false
      - ELASTIC_APM_DISABLED=true
    networks:
      - traefik-network
    labels:
      # Enable Traefik untuk monitoring dan dashboard
      - "traefik.enable=true"
      # Service internal - tanpa router (diakses via API gateway)
      - "traefik.http.services.gate-api.loadbalancer.server.port=9601"
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9601/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

networks:
  traefik-network:
    external: true  # PENTING! Gunakan network yang sudah ada
    name: traefik-network  # Nama network yang sama dengan Traefik
