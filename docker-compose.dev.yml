version: '3.8'

services:
  # Development API - Port 9513 untuk Dev
  api-dev:
    container_name: gate-api-development
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "9513:9513"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    environment:
      - NODE_ENV=development
      - APP_PORT=9513
      - APP_NAME=Gate-API-Development
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9513/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      database:
        condition: service_healthy
    networks:
      - gate-network

  # Database PostgreSQL untuk Development
  database:
    container_name: gate-database-dev
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${DB_NAME_DEV:-gate_db_dev}
      - POSTGRES_USER=${DB_USER_DEV:-postgres}
      - POSTGRES_PASSWORD=${DB_PASS_DEV:-postgres}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - gate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_DEV:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gate-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local

